name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same ref when new commits arrive.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate marketplace, manifests, and skills
        run: node scripts/validate.mjs

      - name: Negative fixtures must fail validation
        run: node scripts/validate.mjs --test-fixtures

      - name: Skills must match the pinned canonical source (no drift)
        # Fetches each shipped SKILL.md from flowleap-cli at the ref pinned in
        # sync.json and fails if any differ. --require-network makes a missing
        # network a hard failure here (GitHub Actions always has network), so
        # drift is never silently skipped in CI.
        run: node scripts/check-drift.mjs --require-network
